# SPDX-License-Identifier: MIT
name: Replay
on:
  push:
  pull_request:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check SHA256SUMS
        run: sha256sum -c SHA256SUMS
      - name: Exact verifiers on shipped certificates (standard library only; normal and -O)
        run: |
          for mode in "" "-O"; do
            python -B -I -S $mode verification/verify_exact_certificates.py --report "$RUNNER_TEMP/tree$mode.json"
            python -B -I -S $mode verification/verify_exact_certificates.py --certificates data/broom_exact_certificates.json --report "$RUNNER_TEMP/broom$mode.json"
            python -B -I -S $mode verification/verify_coverage_certificates.py --report "$RUNNER_TEMP/cov$mode.json"
            python -B -I -S $mode verification/verify_constant_gap_chains.py --report "$RUNNER_TEMP/chains$mode.json"
            python -B -I $mode src/replenishment.py > /dev/null
          done
      - name: Semantic negative controls (normal and -O)
        run: |
          python -B -I verification/negative_controls.py --workdir "$RUNNER_TEMP/negctl"
          python -B -I -O verification/negative_controls.py --workdir "$RUNNER_TEMP/negctl-O"
      - name: Install pinned packages
        run: python -m pip install -r requirements.txt
      - name: Regenerate into a temporary directory and re-verify
        run: |
          python -B -I src/independent_calendar_check.py --out "$RUNNER_TEMP/regen"
          python -B -I verification/structural_audit_checks.py --out "$RUNNER_TEMP/regen"
          python -B -I verification/short_cycle_budget_check.py --out "$RUNNER_TEMP/regen"
          python -B -I src/benchmark_small_trees.py --out "$RUNNER_TEMP/regen"
          python -B -I src/constant_gap_chains.py --out "$RUNNER_TEMP/regen"
          python -B -I -S verification/verify_exact_certificates.py --data "$RUNNER_TEMP/regen" --report "$RUNNER_TEMP/regen-tree.json"
          python -B -I -S verification/verify_constant_gap_chains.py --data "$RUNNER_TEMP/regen" --report "$RUNNER_TEMP/regen-chains.json"
          python -B -I verification/pair_mean_cycle_audit.py
      - name: Working tree unchanged
        run: test -z "$(git status --porcelain)"
